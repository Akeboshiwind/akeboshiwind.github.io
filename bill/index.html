<!DOCTYPE html><html lang="en"> <head><style>:root{--accent-light:#e5501c;--link-light:#b23b0e;--accent-dark:#ff6a33;--link-dark:#ff8c5e}</style><script>(() => {
const c3 = (n) => +n.toFixed(3);

/** Light and dark `--accent`/`--link` for an OKLCH hue, at the lightness each theme's background needs. */
const fromHue = (hue, chroma = 0.19) => ({
  light: { accent: `oklch(0.62 ${chroma} ${hue})`, link: `oklch(0.47 ${c3(chroma * 0.85)} ${hue})` },
  dark: { accent: `oklch(0.72 ${c3(chroma * 0.9)} ${hue})`, link: `oklch(0.80 ${c3(chroma * 0.7)} ${hue})` },
});

const DEFAULT_ACCENT = 'orange';

/** The light theme's page colour, for the places outside CSS that need it: theme-color and the icon set. */
const PAGE_BACKGROUND = '#f1efe8';

const HUES = [
  ['Red', 25], ['Vermilion', 40], ['Amber', 70], ['Ochre', 90], ['Olive', 120], ['Green', 150],
  ['Teal', 185], ['Cyan', 215], ['Blue', 255], ['Indigo', 280], ['Violet', 305], ['Magenta', 335],
];

const ACCENTS = [
  {
    id: DEFAULT_ACCENT,
    name: 'Orange',
    light: { accent: '#e5501c', link: '#b23b0e' },
    dark: { accent: '#ff6a33', link: '#ff8c5e' },
  },
  ...HUES.map(([name, hue]) => ({ id: `h${hue}`, name, ...fromHue(hue) })),
];

/**
 * A random accent id other than `current`; an unknown `current` counts as the default.
 *
 * @param {string} current
 * @param {() => number} [random] uniform in [0, 1)
 */
function nextAccent(current, random = Math.random) {
  const from = ACCENTS.some((a) => a.id === current) ? current : DEFAULT_ACCENT;
  const others = ACCENTS.filter((a) => a.id !== from);
  return others[Math.floor(random() * others.length)].id;
}

const [L, M, R] = [5, 10, 15];

/** Pip corners for die faces 1–6 (face n is `DICE_FACES[n - 1]`); each pip is 4×4 on a 24-unit icon. */
const DICE_FACES = [
  [[M, M]],
  [[L, L], [R, R]],
  [[L, L], [M, M], [R, R]],
  [[L, L], [R, L], [L, R], [R, R]],
  [[L, L], [R, L], [M, M], [L, R], [R, R]],
  [[L, L], [R, L], [L, M], [R, M], [L, R], [R, R]],
];

const DEFAULT_FACE = 5;

const isFace = (face) => Number.isInteger(face) && face >= 1 && face <= DICE_FACES.length;

/**
 * A random die face other than `current`, for the re-roll button.
 *
 * @param {number} current
 * @param {() => number} [random] uniform in [0, 1)
 */
function nextFace(current, random = Math.random) {
  const others = DICE_FACES.map((_, i) => i + 1).filter((f) => f !== current);
  return others[Math.floor(random() * others.length)];
}

/**
 * The remembered accent and dice face from their stored form; each part that is missing or invalid
 * falls back to its default independently.
 *
 * @param {string | null} raw as written by `serialiseChoice`
 * @returns {{ id: string, face: number }}
 */
function parseChoice(raw) {
  let stored = null;
  try { stored = JSON.parse(raw); } catch {}
  const { id, face } = stored && typeof stored === 'object' ? stored : {};
  return {
    id: ACCENTS.some((a) => a.id === id) ? id : DEFAULT_ACCENT,
    face: isFace(face) ? face : DEFAULT_FACE,
  };
}

/** @param {{ id: string, face: number }} choice */
const serialiseChoice = ({ id, face }) => JSON.stringify({ id, face });



const ACCENT_VARS = [
  ['--accent-light', 'light', 'accent'],
  ['--link-light', 'light', 'link'],
  ['--accent-dark', 'dark', 'accent'],
  ['--link-dark', 'dark', 'link'],
];

/**
 * Applies the remembered theme and accent to <html> before first paint, keeps them in step with other tabs,
 * and installs `window.__setTheme(pref)` and `window.__setAccent({ id, face })` for the toggles.
 */
function initTheme() {
  const root = document.documentElement;
  const dark = window.matchMedia('(prefers-color-scheme: dark)');
  const get = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const set = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  const readTheme = () => {
    const pref = get('theme');
    return pref === 'light' || pref === 'dark' ? pref : 'auto';
  };
  const applyTheme = (pref) => {
    root.dataset.themePref = pref;
    root.dataset.theme = pref === 'auto' ? (dark.matches ? 'dark' : 'light') : pref;
  };
  const applyAccent = ({ id, face }) => {
    const accent = ACCENTS.find((a) => a.id === id);
    root.dataset.accent = id;
    root.dataset.accentFace = String(face);
    for (const [name, theme, key] of ACCENT_VARS) root.style.setProperty(name, accent[theme][key]);
  };

  root.classList.add('js');
  applyTheme(readTheme());
  applyAccent(parseChoice(get('accent')));

  dark.addEventListener('change', () => applyTheme(readTheme()));
  window.addEventListener('storage', (e) => {
    if (e.key === 'theme') applyTheme(readTheme());
    if (e.key === 'accent') applyAccent(parseChoice(get('accent')));
  });
  window.__setTheme = (pref) => {
    set('theme', pref);
    applyTheme(pref);
  };
  window.__setAccent = (choice) => {
    set('accent', serialiseChoice(choice));
    applyAccent(choice);
  };
}

initTheme();

// Ordered dithering: https://en.wikipedia.org/wiki/Ordered_dithering
function bayer(n) {
  if (n === 1) return [[0]];
  const m = bayer(n / 2);
  const q = (k) => m.map((row) => row.map((v) => 4 * v + k));
  const [a, b, c, d] = [q(0), q(2), q(3), q(1)];
  return [
    ...a.map((row, i) => [...row, ...b[i]]),
    ...c.map((row, i) => [...row, ...d[i]]),
  ];
}

const BAYER_8 = bayer(8);

/**
 * CSS `url()`s of an ordered-dither dissolve, for animating a tiled 4×4 mask: frame k of `steps` has the
 * Bayer cells below level `16k / steps` on, so frame 0 shows nothing, the last shows everything,
 * and each frame keeps every cell the one before had.
 *
 * @param {number} steps
 * @returns {string[]} `steps + 1` frames
 */
function dissolveFrames(steps) {
  const levels = bayer(4);
  return Array.from({ length: steps + 1 }, (_, k) => {
    let rects = '';
    levels.forEach((row, y) => row.forEach((level, x) => {
      if (level < (16 * k) / steps) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }));
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 4" shape-rendering="crispEdges">${rects}</svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  });
}

/**
 * `@keyframes undither-<steps>`, which turns the dissolve's cells on from none to all, and `redither-<steps>`,
 * its reverse, one per line, for a `step-end` animation of a mask tiled at 4×4.
 *
 * @param {number} steps
 * @returns {string}
 */
function dissolveKeyframes(steps) {
  const frames = dissolveFrames(steps);
  const keyframes = (name, order) =>
    `@keyframes ${name} {${order.map((url, k) => `${(100 * k) / steps}% { mask-image: ${url} }`).join(' ')}}`;
  return [keyframes(`undither-${steps}`, frames), keyframes(`redither-${steps}`, [...frames].reverse())].join('\n');
}

// mulberry32: https://gist.github.com/tommyettinger/46a874533244883189143505d203312c
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Threshold a density field into a 1-bit mask.
 *
 * @param {number} cols
 * @param {number} rows
 * @param {(x: number, y: number) => number} density
 *   Called with the cell centre in cell units; returns 0 (never lit) to 1 (always lit).
 * @param {{ method?: 'bayer' | 'noise' | 'atkinson', seed?: number }} [opts] `seed` only affects `noise`.
 * @returns {Uint8Array} row-major, 1 = lit
 */
function dither(cols, rows, density, { method = 'bayer', seed = 1 } = {}) {
  if (method === 'atkinson') return atkinson(cols, rows, density);
  const mask = new Uint8Array(cols * rows);
  const random = rng(seed);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const threshold = method === 'noise'
        ? random()
        : (BAYER_8[y % 8][x % 8] + 0.5) / 64;
      mask[y * cols + x] = density(x + 0.5, y + 0.5) > threshold ? 1 : 0;
    }
  }
  return mask;
}

// Atkinson dithering: https://en.wikipedia.org/wiki/Atkinson_dithering
const ATKINSON_SPREAD = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];

function atkinson(cols, rows, density) {
  const grid = new Float32Array(cols * rows);
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) grid[y * cols + x] = density(x + 0.5, y + 0.5);
  const mask = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      mask[i] = grid[i] >= 0.5 ? 1 : 0;
      const err = (grid[i] - mask[i]) / 8;
      for (const [dx, dy] of ATKINSON_SPREAD) {
        const [nx, ny] = [x + dx, y + dy];
        if (nx >= 0 && nx < cols && ny < rows) grid[ny * cols + nx] += err;
      }

  return mask;
}

const clamp = (v) => Math.min(1, Math.max(0, v));

const shade = (x, y, cx, cy, r) => clamp(0.12 + Math.hypot(x - (cx - r * 0.45), y - (cy - r * 0.5)) / (r * 1.6));

const facet = (d, steps = 4) => Math.round(d * steps) / steps;

function lumpy(random, wobble = 1) {
  const harmonics = [2, 3, 5].map((k, i) => ({ k, phase: random() * Math.PI * 2, amp: wobble * [0.18, 0.12, 0.07][i] * (0.6 + random() * 0.8) }));
  const tilt = (random() - 0.5) * 0.5;
  return (angle) => 1 + harmonics.reduce((s, { k, phase, amp }) => s + amp * Math.sin(k * (angle + tilt) + phase), 0);
}

function stone(x, y, { cx, cy, rx, ry, outline }) {
  const dx = (x - cx) / rx;
  const dy = (y - cy) / ry;
  if (Math.hypot(dx, dy) > outline(Math.atan2(dy, dx))) return null;
  return facet(shade(x, y, cx, cy, Math.max(rx, ry)));

 * `make(cols, rows, random)`, which takes the grid size and a seeded `random` and returns its density function.

  cairn: { method: 'bayer', make: (w, h, random) => {
    const stones = [
      { cx: w * 0.5, cy: h * 0.24, rx: w * 0.2, ry: h * 0.12 },
      { cx: w * 0.52, cy: h * 0.5, rx: w * 0.31, ry: h * 0.14 },
      { cx: w * 0.48, cy: h * 0.78, rx: w * 0.46, ry: h * 0.16 },
    ].map((s) => ({ ...s, outline: lumpy(random, 0.6) }));
    return (x, y) => {
      for (const s of stones) {
        const d = stone(x, y, s);
        if (d !== null) return d;
      }
      return 0;
    };
  } },
};

const PAPER = 0.9;
const INK_FLOOR = 0.15;

const luminance = (rgba, i) => (0.2126 * rgba[4 * i] + 0.7152 * rgba[4 * i + 1] + 0.0722 * rgba[4 * i + 2]) / 255;

/**
 * Density field from an image: dark pixels light up.
 *
 * @param {Uint8ClampedArray} rgba `ImageData.data` for a `cols × rows` image
 * @param {number} cols
 * @param {number} rows
 * @param {{ tone?: 'stretch' | 'equalise' | 'paper' }} [opts]
 *   - `stretch`: contrast stretched to the image's own luminance range.
 *   - `equalise`: histogram equalisation, so each distinct luminance gets an evenly spaced density;
 *     a single-luminance image falls back to `stretch`.
 *   - `paper`: luminance ≥ `PAPER` is empty page; the remaining ink is equalised into [`INK_FLOOR`, 1],
 *     so off-white panels don't speckle and the lightest ink colour still shows.
 */
function imageDensity(rgba, cols, rows, { tone = 'stretch' } = {}) {
  const lum = new Float32Array(cols * rows);
  for (let i = 0; i < lum.length; i++) lum[i] = luminance(rgba, i);
  const at = (x, y) => lum[Math.floor(y) * cols + Math.floor(x)];
  if (tone === 'equalise') {
    const equalised = equalise(lum);
    if (equalised) return (x, y) => equalised(at(x, y));
  }
  if (tone === 'paper') {
    const ink = lum.filter((v) => v < PAPER);
    const equalised = ink.length ? equalise(ink) : null;
    return (x, y) => {
      const v = at(x, y);
      if (v >= PAPER) return 0;
      return INK_FLOOR + (1 - INK_FLOOR) * (equalised ? equalised(v) : 1);
    };
  }
  const min = lum.reduce((a, v) => Math.min(a, v), Infinity);
  const range = lum.reduce((a, v) => Math.max(a, v), -Infinity) - min;
  const stretch = range < 0.05 ? (v) => v : (v) => (v - min) / range;
  return (x, y) => clamp(1 - stretch(at(x, y)));
}

function equalise(lum) {
  const bin = (v) => Math.round(v * 255);
  const cdf = new Float32Array(256);
  for (const v of lum) cdf[bin(v)]++;
  for (let b = 1; b < 256; b++) cdf[b] += cdf[b - 1];
  const cdfMin = cdf[bin(lum.reduce((a, v) => Math.min(a, v), Infinity))];
  const span = lum.length - cdfMin;
  if (span === 0) return null;
  return (v) => clamp(1 - (cdf[bin(v)] - cdfMin) / span);
}




const IMAGE_TONES = { ui: 'equalise', image: 'paper' };

const watched = new WeakSet();

function imageField(el, cols, rows, repaint) {
  const img = el.parentElement.querySelector('img');
  if (!img) return null;
  if (!watched.has(img)) {
    watched.add(img);
    img.addEventListener('load', repaint);
  }
  if (!img.complete || !img.naturalWidth) return null;
  // naturalWidth is density-corrected for srcset candidates, but drawImage's source rect is in bitmap pixels,
  // so crop with the destination rect, which only depends on the aspect ratio.
  const s = Math.max(cols / img.naturalWidth, rows / img.naturalHeight);
  const [dw, dh] = [img.naturalWidth * s, img.naturalHeight * s];
  const ctx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  ctx.canvas.width = cols;
  ctx.canvas.height = rows;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
  return imageDensity(ctx.getImageData(0, 0, cols, rows).data, cols, rows, { tone: IMAGE_TONES[el.dataset.ditherKind] });
}

function imageShape(el, seed) {
  const repaint = () => {
    const box = el.getBoundingClientRect();
    paint(el, seed, box.width, box.height);
  };
  return { method: 'atkinson', make: (cols, rows) => imageField(el, cols, rows, repaint) };
}

function maskUrl(mask, cols, rows, scale) {
  const cells = document.createElement('canvas');
  cells.width = cols;
  cells.height = rows;
  const pixels = new ImageData(cols, rows);
  mask.forEach((on, i) => { pixels.data[4 * i + 3] = on ? 255 : 0; });
  cells.getContext('2d').putImageData(pixels, 0, 0);

  // Mask images are resampled smoothly, so draw at device resolution to keep pixel edges hard.
  const canvas = document.createElement('canvas');
  canvas.width = cols * scale;
  canvas.height = rows * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(cells, 0, 0, canvas.width, canvas.height);
  return `url(${canvas.toDataURL()})`;
}

function paint(el, seed, width, height) {
  const shape = el.dataset.dither || 'rule';
  const px = Number(el.dataset.px) || 2;
  const cols = Math.ceil(width / px);
  const rows = Math.ceil(height / px);
  if (!cols || !rows) return;

  const { method, make } = shape === 'image' ? imageShape(el, seed) : shapes[shape] ?? {};
  const random = rng(seed);
  const density = make?.(cols, rows, random);
  if (!density) return;

  const mask = dither(cols, rows, density, { method, seed: Math.floor(random() * 2 ** 32) });

  const url = maskUrl(mask, cols, rows, Math.max(1, Math.round(px * devicePixelRatio)));
  const size = `${cols * px}px ${rows * px}px`;
  Object.assign(el.style, {
    maskImage: url, webkitMaskImage: url,
    maskSize: size, webkitMaskSize: size,
  });
  el.dataset.dithered = '';
}

function markTouched({ target }) {
  target.closest?.('.dither-img')?.setAttribute('data-touched', '');
}

const DISSOLVES = { undither: 'in', redither: 'out' };
const settledAs = (animationName) => DISSOLVES[animationName.replace(/-\d+$/, '')];

// Covers a dissolve that starts but never fires animationend.
const SETTLE_SLACK_MS = 50;

/**
 * Mark each element whose dissolve has finished with `data-dissolved="in" | "out"`, so CSS can swap the
 * animation's held last frame for a plain resting style; WebKit sometimes leaves a dissolve painted mid-way.
 */
function settleDissolves(root = document) {
  const timers = new WeakMap();
  const settle = (el, state) => {
    clearTimeout(timers.get(el));
    el.dataset.dissolved = state;
  };
  root.addEventListener('animationstart', ({ target, animationName }) => {
    const state = settledAs(animationName);
    if (!state) return;
    delete target.dataset.dissolved;
    clearTimeout(timers.get(target));
    const ms = (Number.parseFloat(getComputedStyle(target).animationDuration) || 0) * 1000;
    timers.set(target, setTimeout(() => settle(target, state), ms + SETTLE_SLACK_MS));
  });
  root.addEventListener('animationend', ({ target, animationName }) => {
    const state = settledAs(animationName);
    if (state) settle(target, state);
  });
}

const SELECTOR = 'hr, [data-dither]';

/** Paint every `hr` and `[data-dither]` element, including ones added later, repainting when its size changes. */
function ditherAll(root = document) {
  let nextSeed = 1;
  const seeds = new WeakMap();
  const sizes = new WeakMap();
  const resizes = new ResizeObserver((entries) => {
    for (const { target, borderBoxSize: [box] } of entries) {
      const [width, height] = [box.inlineSize, box.blockSize];
      // Hidden elements report 0×0; keeping the last real size means showing them again doesn't re-dither.
      if (!width || !height) continue;
      const size = `${Math.round(width)}x${Math.round(height)}`;
      if (sizes.get(target) === size) continue;
      sizes.set(target, size);
      paint(target, seeds.get(target), width, height);
    }
  });
  const track = (el) => {
    if (seeds.has(el)) return;
    const inOrder = nextSeed++;
    const seed = Number.parseInt(el.dataset.seed ?? '', 10);
    seeds.set(el, Number.isNaN(seed) ? inOrder : seed);
    resizes.observe(el);
  };
  root.querySelectorAll(SELECTOR).forEach(track);
  root.addEventListener('pointerover', markTouched);
  root.addEventListener('focusin', markTouched);
  settleDissolves(root);
  new MutationObserver((records) => records.forEach(({ addedNodes }) => addedNodes.forEach((node) => {
    if (node.nodeType !== 1) return;
    if (node.matches(SELECTOR)) track(node);
    node.querySelectorAll(SELECTOR).forEach(track);
  }))).observe(root.body ?? root, { childList: true, subtree: true });
}

ditherAll();
})();</script>  </body></html>
